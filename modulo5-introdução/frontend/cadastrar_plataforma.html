
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Cadastrar Jogo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            color: #222;
            padding: 40px;
            border-radius: 18px;
            width: 420px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            border-top: 5px solid #7b2ff7;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #6c35c9;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f8f7fc;
            color: #333;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #7b2ff7;
            box-shadow: 0 0 6px rgba(123, 47, 247, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7b2ff7, #4a00e0);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #4a00e0, #240090);
            transform: scale(1.02);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cadastrar Jogo</h1>

        <form>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Ex: GTA VI">

            <label for="genero">Gênero</label>
            <input type="text" id="genero" placeholder="Ex: Ação">

            <label for="preco">Preço</label>
            <input type="number" id="preco" placeholder="Ex: 199.90" step="0.01">

            <label for="plataforma">Plataforma</label>
            <select id="plataforma">
                <option value="">-- Selecione --</option>
                <option value="1">Playstation 5</option>
                <option value="2">XBox Series X</option>
                <option value="3">PC</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
