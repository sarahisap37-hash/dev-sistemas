
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Plataforma</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8eaf6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: #4a47a3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #29266e;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Cadastrar Plataforma</h1>

        <form>
            <input 
                type="text" 
                name="nome_plataforma" 
                placeholder="Digite o nome da plataforma"
                required
            >

            <button type="submit">Cadastrar</button>
        </form>
    </div>

</body>
</html>
