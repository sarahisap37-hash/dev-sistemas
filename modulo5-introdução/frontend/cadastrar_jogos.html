
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Avaliar Jogo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            color: #222;
            padding: 40px;
            border-radius: 18px;
            width: 420px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            border-top: 5px solid #7b2ff7;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #6c35c9;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f8f7fc;
            color: #333;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #7b2ff7;
            box-shadow: 0 0 6px rgba(123, 47, 247, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7b2ff7, #4a00e0);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #4a00e0, #240090);
            transform: scale(1.02);
        }

        .erro {
            color: #e63946;
            font-size: 13px;
            margin-top: -14px;
            margin-bottom: 16px;
        }

        .sucesso {
            color: #218838;
            font-weight: bold;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Avaliar Jogo</h1>

        <form id="form-avaliacao">

            <label for="comentario">Comentário</label>
            <input
                type="text"
                id="comentario"
                placeholder="O que você achou do jogo?"
            >

            <p class="erro" id="erro-comentario"></p>

            <label for="nota">Nota (1 a 5)</label>
            <input
                type="number"
                id="nota"
                placeholder="Ex: 5"
            >

            <p class="erro" id="erro-nota"></p>

            <button type="submit">Enviar Avaliação</button>

        </form>

        <p class="sucesso" id="mensagem-sucesso"></p>

    </div>

    <script>
        const form = document.getElementById("form-avaliacao");

        form.addEventListener("submit", function (event) {

            // Não deixa a página recarregar
            event.preventDefault();

            // Limpar mensagens anteriores
            document.getElementById("erro-comentario").textContent = "";
            document.getElementById("erro-nota").textContent = "";
            document.getElementById("mensagem-sucesso").textContent = "";

            // Ler valores
            const comentario = document.getElementById("comentario").value.trim();
            const nota = parseFloat(document.getElementById("nota").value);

            // Validar
            let valido = true;

            if (comentario === "") {
                document.getElementById("erro-comentario").textContent =
                    "O comentário é obrigatório.";
                valido = false;
            }

            if (isNaN(nota) || nota < 1 || nota > 5) {
                document.getElementById("erro-nota").textContent =
                    "A nota deve ser um número entre 1 e 5.";
                valido = false;
            }

            // Se passou em tudo
            if (valido) {

                console.log("Avaliação válida:", { comentario, nota });

                document.getElementById("mensagem-sucesso").textContent =
                    "Avaliação enviada com sucesso!";
            }
        });
    </script>

</body>
</html>
